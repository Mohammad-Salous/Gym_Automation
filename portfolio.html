$("btns").replaceChildren(el("a",{className:"btn main",href:"#projects",textContent:c.btn1}),el("a",{className:"btn",href:"#contact",textContent:c.btn2}));
$("about").textContent=c.aboutL;
$("aboutCard").replaceChildren(el("h3",{textContent:c.aboutT}),...c.about.map(p=>el("p",{textContent:p})));
$("skillsCard").replaceChildren(el("h3",{textContent:c.skillT}),...c.skills.map(([k,i])=>el("div",{className:"sg"},[el("h4",{textContent:k}),el("ul",{className:"chips"},i.map(x=>el("li",{textContent:x})))])));
$("projects").textContent=c.projL;
$("projList").replaceChildren(...c.projects.map(p=>{
const acts=el("div",{className:"acts"},p.links.map(([cls,txt,url])=>el("a",{className:"btn "+cls,href:url,target:"_blank",rel:"noopener",textContent:txt})));
return el("article",{className:"card project s6"},[el("h3",{textContent:p.t}),el("p",{textContent:p.d}),
el("ul",{className:"feat"},p.f.map(([a,b])=>el("li",{},[el("b",{textContent:a+": "}),b]))),
el("ul",{className:"tags"},p.tags.map(t=>el("li",{textContent:t}))),acts])}));
$("edu").textContent=c.eduL;
$("eduList").replaceChildren(...c.edu.map(([w,t,p])=>el("div",{},[el("div",{className:"when",textContent:w}),el("div",{className:"what",textContent:t}),el("div",{className:"where",textContent:p})])));
$("contT").textContent=c.contT;$("contP").textContent=c.contP;$("copy").textContent=c.copy}

// Remember the chosen language
let lang="en";try{lang=localStorage.getItem("lang")||"en"}catch(e){}
render(lang);
$("langBtn").addEventListener("click",()=>{lang=lang==="en"?"ar":"en";try{localStorage.setItem("lang",lang)}catch(e){}render(lang)});
</script>
</body>
</html>
